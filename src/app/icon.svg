<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D8DFF"/>
      <stop offset="50%" stop-color="#B07DFF"/>
      <stop offset="100%" stop-color="#E0A63A"/>
    </linearGradient>
  </defs>
  <!-- Vinyl disc -->
  <circle cx="16" cy="16" r="15" fill="#1a1a2e" stroke="url(#g)" stroke-width="1.2"/>
  <!-- Grooves -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#2a2a40" stroke-width="0.5"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#2a2a40" stroke-width="0.5"/>
  <!-- Label area -->
  <circle cx="16" cy="16" r="5.5" fill="url(#g)" opacity="0.9"/>
  <!-- Center hole -->
  <circle cx="16" cy="16" r="1.2" fill="#1a1a2e"/>
  <!-- M letterform -->
  <text x="16" y="20" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="10" fill="#1a1a2e" letter-spacing="-0.5">M</text>
</svg>
